<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sketch Clash</title>
    <meta name="description" content="Paint an army and watch the battle unfold.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=5">
  </head>
  <body>
    <div class="stage-wrap" id="stage-wrap">
      <canvas id="ground"></canvas>
      <canvas id="stage" role="img" aria-label="Battlefield: click and drag to paint soldiers"></canvas>
      <div class="midline" id="midline" hidden></div>

      <a class="back" href="../../" aria-label="Back to home">&larr;<span> Home</span></a>
      <h1 class="logo" aria-label="Sketch Clash"><span>S</span><span>k</span><span>e</span><span>t</span><span>c</span><span>h</span> <span>C</span><span>l</span><span>a</span><span>s</span><span>h</span></h1>

      <div class="tools">
        <button type="button" class="icon-btn" id="eraser" aria-label="Eraser" aria-pressed="false" title="Eraser">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        </button>
        <button type="button" class="icon-btn" id="clear" aria-label="Clear the battlefield" title="Clear everything">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3 12 11"/><path d="m10 9 5 5c-2 3-5 5-9 6-1 .3-2-.7-1.6-1.8.6-1.5.8-3 .8-4.6 0-1 .6-1.7 1.6-2l3.2-.6z"/><path d="m8 15 2 2"/></svg>
        </button>
        <button type="button" class="icon-btn" id="pause" aria-label="Pause" title="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="pause-icon"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
      </div>

      <label class="brush-box" title="Brush size">
        <span class="brush-dot" id="brush-dot" aria-hidden="true"></span>
        <input type="range" id="brush" min="10" max="90" value="22" aria-label="Brush size">
      </label>

      <div class="team-label red" id="label-red" hidden><i class="dot red"></i>Red team</div>
      <div class="team-label blue" id="label-blue" hidden><i class="dot blue"></i>Blue team</div>
      <div class="banner" id="banner" role="status" hidden></div>

      <div class="legend" id="legend" hidden aria-label="Units on the field"></div>

      <button type="button" class="start-btn" id="start" hidden>START</button>

      <div class="palette" id="palette" title="Drag to move">
        <div class="tabs" role="tablist" aria-label="Unit type">
          <button type="button" role="tab" aria-selected="true">Army</button>
          <button type="button" role="tab" aria-selected="false" disabled title="Coming soon">Animals</button>
          <button type="button" role="tab" aria-selected="false" disabled title="Coming soon">Mythical</button>
          <button type="button" role="tab" aria-selected="false" disabled title="Coming soon">Terrain</button>
        </div>
        <div class="units" role="group" aria-label="Army units">
          <button type="button" class="unit-btn" aria-pressed="true" aria-label="Soldier" title="Soldier">
            <canvas id="soldier-icon" width="132" height="96"></canvas>
          </button>
        </div>
      </div>

      <div class="team-box">
        <label class="toggle">
          <input type="checkbox" id="team-toggle" role="switch">
          <span class="track" aria-hidden="true"></span>
          <span class="toggle-label">Team battle</span>
        </label>
      </div>
    </div>

    <script type="module" src="src/main.js?v=5"></script>
  </body>
</html>
