<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sketch Clash</title>
    <meta name="description" content="Paint an army and watch the battle unfold.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=171">
  </head>
  <body>
    <div class="stage-wrap" id="stage-wrap">
      <canvas id="ground"></canvas>
      <canvas id="stage" role="img" aria-label="Battlefield: click and drag to paint your army"></canvas>
      <div class="midline" id="midline" hidden></div>

      <a class="back" href="../../" aria-label="Back to home">&larr;<span> Home</span></a>
      <h1 class="logo" aria-label="Sketch Clash"><span>S</span><span>k</span><span>e</span><span>t</span><span>c</span><span>h</span> <span>C</span><span>l</span><span>a</span><span>s</span><span>h</span></h1>

      <div class="tools">
        <button type="button" class="icon-btn" id="eraser" aria-label="Eraser" aria-pressed="false" title="Eraser">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        </button>
        <button type="button" class="icon-btn" id="clear" aria-label="Clear the battlefield" title="Clear everything">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(45 12 12)"><path d="M12 1.5V10"/><rect x="9" y="10" width="6" height="2.6" rx="1"/><path d="M8.4 12.6h7.2l1.9 7.9H6.5z"/><path d="M10.4 14.8v5.7M12 14.8v5.7M13.6 14.8v5.7"/></g></svg>
        </button>
        <button type="button" class="icon-btn" id="pause" aria-label="Pause" title="Pause">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="pause-icon"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        </button>
        <button type="button" class="icon-btn" id="settings" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true" id="settings-icon"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <label class="brush-box" title="Brush size (lowest = one unit per click)">
        <span class="brush-dot" id="brush-dot" aria-hidden="true"></span>
        <input type="range" id="brush" min="0" max="90" value="9" aria-label="Brush size">
      </label>

      <div class="team-label red" id="label-red" hidden><i class="dot red"></i>Red team</div>
      <div class="team-label blue" id="label-blue" hidden><i class="dot blue"></i>Blue team</div>
      <div class="paused-pill" id="paused" role="status" hidden>PAUSED</div>
      <div class="result" id="result" hidden>
        <div class="banner" id="banner" role="status"></div>
        <div class="result-btns">
          <button type="button" class="pill-btn red" id="new-battle">NEW BATTLE</button>
          <button type="button" class="pill-btn white" id="stats-btn">STATS</button>
        </div>
      </div>

      <div class="legend" id="legend" hidden aria-label="Units on the field"></div>

      <button type="button" class="start-btn" id="start" hidden>START</button>

      <div class="palette" id="palette">
        <div class="unit-tip" id="unit-tip" hidden></div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Unit type"></div>
        <div class="units" id="units" role="group" aria-label="Units"></div>
      </div>

      <div class="team-box">
        <label class="toggle">
          <input type="checkbox" id="team-toggle" role="switch">
          <span class="track" aria-hidden="true"></span>
          <span class="toggle-label">Team battle</span>
        </label>
      </div>
    </div>

    <div class="settings" id="settings-panel" hidden>
      <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <button type="button" class="modal-close" id="settings-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <h2 class="settings-title" id="settings-title">Settings</h2>
        <label class="setting-row">
          <span class="setting-text"><b>Lammy Mode</b><small>Off: crowds shove apart like the original. On: the old, softer crowd physics.</small></span>
          <span class="toggle big"><input type="checkbox" id="lammy-toggle" role="switch"><span class="track" aria-hidden="true"></span></span>
        </label>
        <label class="setting-row">
          <span class="setting-text"><b>Chef Block</b><small>Off: chefs stay where you paint them. On: they snap into a square block and march as one.</small></span>
          <span class="toggle big"><input type="checkbox" id="wall-toggle" role="switch"><span class="track" aria-hidden="true"></span></span>
        </label>
      </div>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button type="button" class="modal-close" id="modal-close" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-sub" id="modal-sub"></p>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="src/main.js?v=171"></script>
  </body>
</html>
