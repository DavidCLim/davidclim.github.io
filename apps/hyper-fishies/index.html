<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HYPER FISHIES</title>
    <meta name="description" content="A Fisch-style dock fishing game with top-down walking and side-view casting.">
    <link rel="stylesheet" href="styles.css?v=5.3">
  </head>
  <body>
    <main class="game-shell">
      <section class="game-panel" aria-label="Hyper Fishies game">
        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="960" height="560" aria-label="Hyper Fishies playable game area"></canvas>

          <div class="screen-hidden" aria-hidden="true">
            <a class="back-link" href="../../">HOME</a>
            <button id="restartButton" class="game-button" type="button">RESET</button>
            <strong id="coinsText">0</strong>
            <strong id="bagText">0/6</strong>
            <strong id="areaText">DOCK</strong>
            <strong id="rodText">I</strong>
            <strong id="latestText">NONE</strong>
            <button id="castButton" class="game-button" type="button">CAST</button>
            <button id="sellButton" class="game-button" type="button">SELL FISH</button>
            <button id="upgradeButton" class="game-button" type="button">UPGRADE ROD</button>
            <div id="statusText">Walk to the small top fishing dock to start fishing.</div>
            <div id="messagePanel"><h1>HYPER FISHIES</h1><p></p><button id="startButton" type="button">PLAY</button></div>
          </div>

          <div id="joystick" class="joystick" aria-label="Mobile joystick"><div id="joystickKnob"></div></div>
        </div>
      </section>
    </main>
    <script src="script.js?v=3.9"></script>
    <script src="sell-style.js?v=1.1"></script>
    <script src="rod-shop.js?v=1.0"></script>
    <script src="roblox-anatomy.js?v=1.0"></script>
    <script src="fisch-polish.js?v=1.0"></script>
    <script src="no-shop.js?v=1.1"></script>
    <script src="fish-catch.js?v=1.0"></script>
    <script src="character-fix.js?v=1.0"></script>
  </body>
</html>
