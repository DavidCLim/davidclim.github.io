<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HYPER FISHIES</title>
    <meta name="description" content="A Fisch-style dock fishing game with top-down walking and side-view casting.">
    <link rel="stylesheet" href="styles.css?v=5.0">
  </head>
  <body>
    <main class="game-shell">
      <section class="game-panel" aria-label="Hyper Fishies game">
        <div class="topbar">
          <a class="back-link" href="../../">HOME</a>
          <div class="brand">
            <span class="brand-main">HYPER</span>
            <span class="brand-sub">fishies</span>
          </div>
          <button id="restartButton" class="game-button" type="button">RESET</button>
        </div>

        <div class="hud" aria-live="polite">
          <div class="hud-card"><span>COINS</span><strong id="coinsText">0</strong></div>
          <div class="hud-card"><span>BAG</span><strong id="bagText">0/6</strong></div>
          <div class="hud-card"><span>AREA</span><strong id="areaText">DOCK</strong></div>
          <div class="hud-card"><span>ROD</span><strong id="rodText">I</strong></div>
          <div class="hud-card"><span>LATEST</span><strong id="latestText">NONE</strong></div>
        </div>

        <div class="action-row">
          <button id="castButton" class="game-button" type="button">CAST</button>
          <button id="sellButton" class="game-button" type="button">SELL FISH</button>
          <button id="upgradeButton" class="game-button" type="button">UPGRADE ROD</button>
          <div id="statusText" class="status-pill">Walk to the small top fishing dock to start fishing.</div>
        </div>

        <div class="canvas-wrap">
          <canvas id="gameCanvas" width="960" height="560" aria-label="Hyper Fishies playable game area"></canvas>
          <div id="messagePanel" class="message-panel show">
            <h1>HYPER FISHIES</h1>
            <p>Walk around the wooden dock. Go to the small top fishing dock, then cast for fish.</p>
            <button id="startButton" class="game-button big" type="button">PLAY</button>
          </div>
          <div id="joystick" class="joystick" aria-label="Mobile joystick"><div id="joystickKnob"></div></div>
        </div>

        <div class="controls-note">MOVE: WASD / ARROWS / JOYSTICK | FISHING: SPACE, F, OR CAST BUTTON | SELL AT SHOP</div>
      </section>
    </main>
    <script src="script.js?v=3.1"></script>
  </body>
</html>
