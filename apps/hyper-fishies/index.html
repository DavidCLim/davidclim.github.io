<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Hyper Fishies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>

<body>
<div id="boot-loader" class="boot-loader" aria-hidden="true">
  <div class="boot-loader-rays"></div>
  <div class="boot-loader-bubbles">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

    <span class="fish fish-2">🐠</span>
    <span class="fish fish-3">🐡</span>
    <span class="fish fish-4">🐟</span>

  </div>
  <div class="boot-loader-content">
    <div class="boot-loader-title">HYPER FISHIES</div>
    <div class="boot-loader-bar-track"><div class="boot-loader-bar-fill"></div></div>
    <div class="boot-loader-caption">Casting off&hellip;</div>
  </div>
</div>
<div id="app">
  <div id="game-root"></div>
</div>
<script type="module" src="src/main.js"></script>
