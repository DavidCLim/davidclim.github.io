<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Hyper Fishies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
</head>
<body>
<div id="boot-loader" class="boot-loader" aria-hidden="true">
  <div class="boot-loader-rays"></div>
  <div class="boot-loader-bubbles">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <div class="boot-loader-weeds">
    <span class="weed weed-1"></span><span class="weed weed-2"></span><span class="weed weed-3"></span>
    <span class="weed weed-4"></span><span class="weed weed-5"></span>
  </div>
  <div class="boot-loader-floor"></div>
  <div class="boot-loader-fish">
    <svg class="fish fish-1" viewBox="0 0 100 60"><defs><linearGradient id="bf1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe6a8"/><stop offset="1" stop-color="#c9922a"/></linearGradient></defs>
      <path d="M20,30 L2,14 L9,30 L2,46 Z" fill="url(#bf1)"/>
      <path d="M22,30 C22,14 46,6 72,13 C88,17 97,24 97,30 C97,36 88,43 72,47 C46,54 22,46 22,30 Z" fill="url(#bf1)"/>
      <circle cx="74" cy="23" r="3.2" fill="#1c1006"/>
    </svg>
    <svg class="fish fish-2" viewBox="0 0 100 60"><defs><linearGradient id="bf2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8f5e2"/><stop offset="1" stop-color="#2f8f78"/></linearGradient></defs>
      <path d="M20,30 L2,14 L9,30 L2,46 Z" fill="url(#bf2)"/>
      <path d="M22,30 C22,14 46,6 72,13 C88,17 97,24 97,30 C97,36 88,43 72,47 C46,54 22,46 22,30 Z" fill="url(#bf2)"/>
      <circle cx="74" cy="23" r="3.2" fill="#0c1a1e"/>
    </svg>
    <svg class="fish fish-3" viewBox="0 0 100 60"><defs><linearGradient id="bf3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc4b3"/><stop offset="1" stop-color="#c95f4e"/></linearGradient></defs>
      <path d="M20,30 L2,14 L9,30 L2,46 Z" fill="url(#bf3)"/>
      <path d="M22,30 C22,14 46,6 72,13 C88,17 97,24 97,30 C97,36 88,43 72,47 C46,54 22,46 22,30 Z" fill="url(#bf3)"/>
      <circle cx="74" cy="23" r="3.2" fill="#3a0a0a"/>
    </svg>
    <svg class="fish fish-4" viewBox="0 0 100 60"><defs><linearGradient id="bf4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe6a8"/><stop offset="1" stop-color="#c9922a"/></linearGradient></defs>
      <path d="M20,30 L2,14 L9,30 L2,46 Z" fill="url(#bf4)"/>
      <path d="M22,30 C22,14 46,6 72,13 C88,17 97,24 97,30 C97,36 88,43 72,47 C46,54 22,46 22,30 Z" fill="url(#bf4)"/>
      <circle cx="74" cy="23" r="3.2" fill="#1c1006"/>
    </svg>
    <svg class="fish fish-5" viewBox="0 0 100 60"><defs><linearGradient id="bf5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8f5e2"/><stop offset="1" stop-color="#2f8f78"/></linearGradient></defs>
      <path d="M20,30 L2,14 L9,30 L2,46 Z" fill="url(#bf5)"/>
      <path d="M22,30 C22,14 46,6 72,13 C88,17 97,24 97,30 C97,36 88,43 72,47 C46,54 22,46 22,30 Z" fill="url(#bf5)"/>
      <circle cx="74" cy="23" r="3.2" fill="#0c1a1e"/>
    </svg>
  </div>
  <div class="boot-loader-content">
    <div class="boot-loader-title">HYPER FISHIES</div>
    <div class="boot-loader-bar-track"><div class="boot-loader-bar-fill"></div></div>
    <div class="boot-loader-caption">Casting off&hellip;</div>
  </div>
</div>
<div id="app">
  <div id="game-root"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
